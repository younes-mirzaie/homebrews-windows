# Builds RetroTel on a self-hosted Windows runner that has Visual Studio 2015 and the
# Windows Phone 8.1 SDK (GitHub-hosted runners don't have the WP 8.1 SDK).
# The Telegram api_id / api_hash come from repository secrets and only exist during the build.
name: retrotel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, windows, wp81]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Release|ARM
        shell: powershell
        env:
          TG_API_ID: ${{ secrets.TG_API_ID || secrets.TELEGRAM_API_ID || secrets.API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH || secrets.TELEGRAM_API_HASH || secrets.API_HASH }}
        run: .\retrotel\build.ps1 -Configuration Release -Platform ARM

      - name: Remove generated secrets file
        if: always()
        shell: powershell
        run: Remove-Item -ErrorAction SilentlyContinue .\retrotel\app\MetroTelegram\AppConfig.Secrets.cs

      - uses: actions/upload-artifact@v4
        with:
          name: retrotel-xap
          path: retrotel/out/*.xap
          retention-days: 14
